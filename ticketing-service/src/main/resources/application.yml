spring:
  application:
    name: ticketing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servicedesk}
    username: ${DB_USER:servicedesk}
    password: ${DB_PASSWORD:servicedesk}
  flyway:
    schemas: ticketing
    default-schema: ticketing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION:60}
    issuer: ticketing-service
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
