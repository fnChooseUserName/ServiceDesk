spring:
  datasource:
    url: jdbc:h2:mem:ticketing;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    schemas: ticketing
    default-schema: ticketing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: test-only-jwt-signing-secret-not-for-production-use
    expiration-minutes: 60
    issuer: ticketing-service
  cors:
    allowed-origin: http://localhost:4200
