services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: servicedesk
      POSTGRES_DB: servicedesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  ticketing-service:
    build:
      context: ../ticketing-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: servicedesk
      DB_USER: servicedesk
      DB_PASSWORD: servicedesk
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see README.md "Database migrations and seed data")}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-60}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      SEED_USERS_ENABLED: ${SEED_USERS_ENABLED:-false}
      SEED_REQUESTER_PASSWORD: ${SEED_REQUESTER_PASSWORD:-}
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ../notification-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: servicedesk
      DB_USER: servicedesk
      DB_PASSWORD: servicedesk
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
